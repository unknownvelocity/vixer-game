<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIXER - Planet Defense Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a2e;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            color: white;
        }

        .game-container {
            text-align: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
        }

        .game-header {
            margin-bottom: 10px;
        }

        .game-header h1 {
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            font-size: clamp(20px, 5vw, 32px);
        }

        .game-header p {
            color: #888;
            font-size: clamp(12px, 2vw, 16px);
            margin-top: 5px;
        }

        canvas {
            border: 3px solid #00ffff;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            background: #0a0a2e;
            cursor: pointer;
            /* Responsive scaling */
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .controls {
            margin-top: 10px;
            color: #888;
            font-size: clamp(11px, 2vw, 14px);
            flex-wrap: wrap;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .controls span {
            margin: 0 10px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🎮 VIXER - Planet Defense</h1>
            <p>Survive the Black Hole. Protect Your Planet!</p>
        </div>
        <canvas id="gameCanvas" width="1200" height="700"></canvas>
        <div class="controls">
            <span>🖱️ Click Asteroids</span>
            <span>⬆️ Upgrade Planet</span>
            <span>[-] Galaxy View</span>
            <span>[+] Normal View</span>
            <span>[R] Restart</span>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
